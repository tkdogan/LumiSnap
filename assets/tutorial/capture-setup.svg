<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">Camera setup for a lighting study</title><desc id="desc">Plan and section: a level fisheye at the observer&#x27;s eye position captures the forward hemisphere. A lux sensor is placed at the same position facing the same direction. A matte calibration target is visible.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#306848"/></marker></defs>
<g id="background"><rect width="1200" height="710" fill="#f0f3e9"/></g>
<g font-family="Arial, Helvetica, sans-serif"><g id="headings"><text x="44" y="54" font-size="21" fill="#306848" font-weight="bold" text-anchor="start">01 / A POSITION, A DIRECTION, A HEMISPHERE</text><text x="55" y="112" font-size="25" fill="#162d26" font-weight="bold" text-anchor="start">Plan: capture the view in front of the observer</text><text x="755" y="112" font-size="25" fill="#162d26" font-weight="bold" text-anchor="start">Section: place the lens at eye level</text></g><g id="room-plan"><rect x="65" y="150" width="620" height="420" rx="0" fill="#e4ebdf" stroke="#b8c9ba" stroke-width="2"/><path d="M 110 425 A 250 250 0 0 1 610 425 L 360 425 Z" fill="#cdfc80" fill-opacity="0.45"/><path d="M 110 425 A 250 250 0 0 1 610 425" fill="none" stroke="#306848" stroke-width="3" stroke-dasharray="9 7"/><rect x="235" y="144" width="250" height="12" rx="0" fill="#a5c7dd" stroke="#306848" stroke-width="2"/><text x="360" y="197" font-size="20" fill="#306848" font-weight="bold" text-anchor="middle">WINDOW</text><path d="M 360 395 L 360 240" fill="none" stroke="#306848" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="380" y="310" font-size="22" fill="#162d26" font-weight="normal" text-anchor="start">View direction</text><rect x="328" y="413" width="64" height="40" rx="5" fill="#162d26" stroke="#162d26" stroke-width="2"/><circle cx="360" cy="415" r="15" fill="#a5c7dd" stroke="#162d26" stroke-width="3"/><text x="360" y="495" font-size="22" fill="#162d26" font-weight="normal" text-anchor="middle">Lens at observer position</text><text x="360" y="535" font-size="20" fill="#50665b" font-weight="normal" text-anchor="middle">180° in plan; the full forward hemisphere in 3D</text><circle cx="177" cy="308" r="20" fill="#8b9984" stroke="#306848" stroke-width="2"/><path d="M 177 330 L 177 372" fill="none" stroke="#306848" stroke-width="3" stroke-dasharray=""/><text x="95" y="402" font-size="20" fill="#162d26" font-weight="normal" text-anchor="start">Matte target</text></g><g id="eye-height-section"><path d="M 745 565 L 1145 565" fill="none" stroke="#162d26" stroke-width="3" stroke-dasharray=""/><rect x="868" y="303" width="65" height="42" rx="5" fill="#162d26" stroke="#162d26" stroke-width="2"/><circle cx="933" cy="323" r="18" fill="#a5c7dd" stroke="#162d26" stroke-width="3"/><path d="M 900 345 L 900 395 M 900 395 L 835 565 M 900 395 L 965 565 M 900 395 L 905 565" fill="none" stroke="#162d26" stroke-width="3" stroke-dasharray=""/><path d="M 950 323 L 1130 323" fill="none" stroke="#306848" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="975" y="300" font-size="21" fill="#162d26" font-weight="normal" text-anchor="start">Level axis</text><path d="M 785 565 L 785 323 M 775 323 L 795 323 M 775 565 L 795 565" fill="none" stroke="#306848" stroke-width="2" stroke-dasharray=""/><text x="755" y="220" font-size="22" fill="#50665b" font-weight="normal" text-anchor="start">Use the actual seated or</text><text x="755" y="252" font-size="22" fill="#50665b" font-weight="normal" text-anchor="start">standing eye height.</text><text x="803" y="457" font-size="20" fill="#162d26" font-weight="normal" text-anchor="start">Record</text><text x="803" y="482" font-size="20" fill="#162d26" font-weight="normal" text-anchor="start">height</text><text x="946" y="393" font-size="21" fill="#162d26" font-weight="bold" text-anchor="start">Lux sensor:</text><text x="946" y="421" font-size="21" fill="#50665b" font-weight="normal" text-anchor="start">same position</text><text x="946" y="453" font-size="21" fill="#50665b" font-weight="normal" text-anchor="start">and view direction</text><path d="M 958 359 L 948 329" fill="none" stroke="#306848" stroke-width="2" stroke-dasharray=""/></g><text x="55" y="634" font-size="22" fill="#162d26" font-weight="normal" text-anchor="start">Keep the operator behind the lens during capture. Record location, time, view direction and sky conditions.</text><text x="55" y="670" font-size="21" fill="#50665b" font-weight="normal" text-anchor="start">For a scale model, place the lens at the equivalent eye position and keep the opening from blocking daylight.</text></g></svg>
