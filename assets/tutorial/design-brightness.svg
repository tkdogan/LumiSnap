<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Perceived brightness: mean luminance in the 40-degree horizontal band</title><desc id="desc">Two room sections with the same 500 lux on the desk. With dark walls the 40-degree band at eye level averages 18 cd/m2 and reads gloomy; with light walls it averages 46 cd/m2 and reads adequately lit. Example values.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#306848"/></marker></defs>
<g id="background"><rect width="1200" height="720" fill="#f0f3e9"/></g>
<g font-family="Arial, Helvetica, sans-serif"><text x="44.0" y="54.0" font-size="21" fill="#306848" font-weight="bold" text-anchor="start">USE 2 / DOES IT FEEL BRIGHT OR GLOOMY? THE 40° BAND</text><g id="dark-walls"><rect x="40.0" y="90.0" width="540.0" height="520.0" rx="12" fill="white" stroke="#b8c9ba" stroke-width="2"/><text x="62.0" y="130.0" font-size="19" fill="#306848" font-weight="bold" text-anchor="start">A / DARK WALLS, LIGHT FLOOR</text><path d="M 80.0 140.0 L 540.0 140.0" fill="none" stroke="#162d26" stroke-width="4" stroke-dasharray=""/><path d="M 80.0 420.0 L 540.0 420.0" fill="none" stroke="#162d26" stroke-width="4" stroke-dasharray=""/><path d="M 80.0 140.0 L 80.0 210.0" fill="none" stroke="#162d26" stroke-width="4" stroke-dasharray=""/><path d="M 80.0 300.0 L 80.0 420.0" fill="none" stroke="#162d26" stroke-width="4" stroke-dasharray=""/><rect x="75.0" y="210.0" width="10.0" height="90.0" rx="0" fill="#a5c7dd" stroke="#162d26" stroke-width="2"/><rect x="512.0" y="140.0" width="28.0" height="280.0" rx="0" fill="#5d6b5f" stroke="#162d26" stroke-width="2"/><rect x="80.0" y="406.0" width="432.0" height="14.0" rx="0" fill="#ffffff" stroke="#162d26" stroke-width="2"/><text x="504.0" y="170.0" font-size="17" fill="#162d26" font-weight="normal" text-anchor="end">dark finish, ρ ≈ 0.2</text><rect x="110.0" y="330.0" width="160.0" height="10.0" rx="0" fill="#d9dfce" stroke="#306848" stroke-width="2"/><path d="M 120.0 340.0 L 120.0 406.0" fill="none" stroke="#162d26" stroke-width="3" stroke-dasharray=""/><path d="M 260.0 340.0 L 260.0 406.0" fill="none" stroke="#162d26" stroke-width="3" stroke-dasharray=""/><text x="120.0" y="318.0" font-size="19" fill="#306848" font-weight="bold" text-anchor="start">Eh = 500 lx</text><polygon points="230.0,285.0 512.0,182.4 512.0,387.6" fill="#cdfc80" fill-opacity="0.55" stroke="#306848" stroke-width="2"/><path d="M 512.0 182.4 L 512.0 387.6" fill="none" stroke="#306848" stroke-width="8" stroke-dasharray=""/><circle cx="230.0" cy="285.0" r="9.0" fill="#ffffff" stroke="#162d26" stroke-width="3" stroke-dasharray=""/><text x="300.0" y="255.0" font-size="19" fill="#306848" font-weight="bold" text-anchor="start">40°</text><text x="310.0" y="500.0" font-size="40" fill="#306848" font-weight="bold" text-anchor="middle">18 cd/m²</text><text x="310.0" y="535.0" font-size="18" fill="#50665b" font-weight="normal" text-anchor="middle">mean luminance in the 40° band</text><text x="310.0" y="568.0" font-size="20" fill="#162d26" font-weight="bold" text-anchor="middle">below ~30: reads gloomy</text></g><g id="light-walls"><rect x="620.0" y="90.0" width="540.0" height="520.0" rx="12" fill="white" stroke="#b8c9ba" stroke-width="2"/><text x="642.0" y="130.0" font-size="19" fill="#306848" font-weight="bold" text-anchor="start">B / LIGHT WALLS, DARK FLOOR</text><path d="M 660.0 140.0 L 1120.0 140.0" fill="none" stroke="#162d26" stroke-width="4" stroke-dasharray=""/><path d="M 660.0 420.0 L 1120.0 420.0" fill="none" stroke="#162d26" stroke-width="4" stroke-dasharray=""/><path d="M 660.0 140.0 L 660.0 210.0" fill="none" stroke="#162d26" stroke-width="4" stroke-dasharray=""/><path d="M 660.0 300.0 L 660.0 420.0" fill="none" stroke="#162d26" stroke-width="4" stroke-dasharray=""/><rect x="655.0" y="210.0" width="10.0" height="90.0" rx="0" fill="#a5c7dd" stroke="#162d26" stroke-width="2"/><rect x="1092.0" y="140.0" width="28.0" height="280.0" rx="0" fill="#ffffff" stroke="#162d26" stroke-width="2"/><rect x="660.0" y="406.0" width="432.0" height="14.0" rx="0" fill="#5d6b5f" stroke="#162d26" stroke-width="2"/><text x="1084.0" y="170.0" font-size="17" fill="#162d26" font-weight="normal" text-anchor="end">light finish, ρ ≈ 0.8</text><rect x="690.0" y="330.0" width="160.0" height="10.0" rx="0" fill="#d9dfce" stroke="#306848" stroke-width="2"/><path d="M 700.0 340.0 L 700.0 406.0" fill="none" stroke="#162d26" stroke-width="3" stroke-dasharray=""/><path d="M 840.0 340.0 L 840.0 406.0" fill="none" stroke="#162d26" stroke-width="3" stroke-dasharray=""/><text x="700.0" y="318.0" font-size="19" fill="#306848" font-weight="bold" text-anchor="start">Eh = 500 lx</text><polygon points="810.0,285.0 1092.0,182.4 1092.0,387.6" fill="#cdfc80" fill-opacity="0.55" stroke="#306848" stroke-width="2"/><path d="M 1092.0 182.4 L 1092.0 387.6" fill="none" stroke="#306848" stroke-width="8" stroke-dasharray=""/><circle cx="810.0" cy="285.0" r="9.0" fill="#ffffff" stroke="#162d26" stroke-width="3" stroke-dasharray=""/><text x="880.0" y="255.0" font-size="19" fill="#306848" font-weight="bold" text-anchor="start">40°</text><text x="890.0" y="500.0" font-size="40" fill="#306848" font-weight="bold" text-anchor="middle">46 cd/m²</text><text x="890.0" y="535.0" font-size="18" fill="#50665b" font-weight="normal" text-anchor="middle">mean luminance in the 40° band</text><text x="890.0" y="568.0" font-size="20" fill="#162d26" font-weight="bold" text-anchor="middle">above ~30: reads adequately lit</text></g><text x="55.0" y="652.0" font-size="21" fill="#162d26" font-weight="normal" text-anchor="start">Same window, same desk illuminance. People judge brightness by the surfaces they look at, not the desk plane.</text><text x="55.0" y="684.0" font-size="20" fill="#50665b" font-weight="normal" text-anchor="start">Band: ±20° about the horizon of a level capture (Loe et al.). Example values.</text></g></svg>
