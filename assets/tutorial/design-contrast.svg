<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
<title id="title">Contrast: luminance ratios and the log-luminance histogram</title><desc id="desc">Task, surround and periphery zones with the IES ballpark ratio 1 : 1/3 : 1/10, and two log-luminance histograms: a narrow, calm view and a wide, two-peaked dramatic view. Example histograms.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#306848"/></marker></defs>
<g id="background"><rect width="1200" height="730" fill="#f0f3e9"/></g>
<g font-family="Arial, Helvetica, sans-serif"><text x="44.0" y="54.0" font-size="21" fill="#306848" font-weight="bold" text-anchor="start">USE 3 / IS IT CALM OR DRAMATIC? CONTRAST</text><g id="ratios"><rect x="40.0" y="90.0" width="520.0" height="560.0" rx="12" fill="white" stroke="#b8c9ba" stroke-width="2"/><text x="62.0" y="130.0" font-size="19" fill="#306848" font-weight="bold" text-anchor="start">A / LUMINANCE RATIOS</text><rect x="70.0" y="150.0" width="460.0" height="290.0" rx="0" fill="#e4ebdf" stroke="#306848" stroke-width="2"/><rect x="150.0" y="215.0" width="300.0" height="165.0" rx="0" fill="#ffffff" stroke="#306848" stroke-width="2" stroke-dasharray="8 6"/><rect x="235.0" y="262.0" width="130.0" height="72.0" rx="0" fill="#cdfc80" stroke="#306848" stroke-width="2"/><text x="300.0" y="305.0" font-size="21" fill="#162d26" font-weight="bold" text-anchor="middle">task</text><text x="300.0" y="243.0" font-size="19" fill="#162d26" font-weight="normal" text-anchor="middle">surround</text><text x="300.0" y="180.0" font-size="19" fill="#162d26" font-weight="normal" text-anchor="middle">periphery</text><text x="70.0" y="492.0" font-size="34" fill="#306848" font-weight="bold" text-anchor="start">1 : 1/3 : 1/10</text><text x="70.0" y="530.0" font-size="19" fill="#50665b" font-weight="normal" text-anchor="start">IES ballpark, task : surround : periphery.</text><text x="70.0" y="559.0" font-size="19" fill="#50665b" font-weight="normal" text-anchor="start">Beyond it, the eye keeps re-adapting.</text></g><g id="histograms"><rect x="600.0" y="90.0" width="560.0" height="560.0" rx="12" fill="white" stroke="#b8c9ba" stroke-width="2"/><text x="622.0" y="130.0" font-size="19" fill="#306848" font-weight="bold" text-anchor="start">B / LOG-LUMINANCE HISTOGRAM OF THE VIEW</text><text x="630.0" y="160.0" font-size="19" fill="#162d26" font-weight="bold" text-anchor="start">Calm: diffuse, even</text><text x="1130.0" y="160.0" font-size="17" fill="#306848" font-weight="bold" text-an