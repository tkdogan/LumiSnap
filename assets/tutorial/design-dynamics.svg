<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">Change over a day: 40-degree band luminance and DGP from hourly captures</title><desc id="desc">Eleven hourly captures from 8:00 to 18:00 in a west-facing studio. The 40-degree band mean rises above 30 cd/m2 in the afternoon and DGP exceeds 0.40 in two captures in the late afternoon. Example values.</desc>
