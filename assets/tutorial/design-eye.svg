<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Vertical illuminance at the eye from a fisheye HDR, with a melanopic estimate</title><desc id="desc">In an angular fisheye, each pixel contributes its luminance times the cosine of its angle from the view direction times its solid angle to the vertical illuminance Ev. A melanopic estimate multiplies Ev by the melanopic daylight efficacy ratio of an assumed spectrum, compared with a 250 lux daytime recommendation. Example values.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#306848"/></marker></defs>
<g id="background"><rect width="1200" height="760" fill="#f0f3e9"/></g>
<g font-family="Arial, Helvetica, sans-serif"><text x="44.0" y="54.0" font-size="21" fill="#306848" font-weight="bold" text-anchor="start">USE 7 / WHAT DOES THE EYE RECEIVE? VERTICAL ILLUMINANCE</text><g id="fisheye"><rect x="40.0" y="90.0" width="560.0" height="590.0" rx="12" fill="white" stroke="#b8c9ba" stroke-width="2"/><text x="62.0" y="130.0" font-size="19" fill="#306848" font-weight="bold" text-anchor="start">A / Ev FROM THE FISHEYE IMAGE</text><circle cx="320.0" cy="395.0" r="215.0" fill="#e4ebdf" stroke="#162d26" stroke-width="3" stroke-dasharray=""/><circle cx="320.0" cy="395.0" r="35.8" fill="none" stroke="#b8c9ba" stroke-width="2" stroke-dasharray="6 6"/><circle cx="320.0" cy="395.0" r="71.7" fill="none" stroke="#b8c9ba" stroke-width="2" stroke-dasharray="6 6"/><circle cx="320.0" cy="395.0" r="107.5" fill="none" stroke="#b8c9ba" stroke-width="2" stroke-dasharray="6 6"/><circle cx="320.0" cy="395.0" r="143.3" fill="none" stroke="#b8c9ba" stroke-width="2" stroke-dasharray="6 6"/><circle cx="320.0" cy="395.0" r="179.2" fill="none" stroke="#b8c9ba" stroke-width="2" stroke-dasharray="6 6"/><path d="M 105.0 395.0 L 535.0 395.0" fill="none" stroke="#b8c9ba" stroke-width="2" stroke-dasharray="6 6"/><path d="M 320.0 180.0 L 320.0 610.0" fill="none" stroke="#b8c9ba" stroke-width="2" stroke-dasharray="6 6"/><text x="326.0" y="417.0" font-size="17" fill="#306848" font-weight="bold" text-anchor="start">cos 0° = 1.00</text><text x="384.7" y="458.1" font-size="17" fill="#306848" font-weight="bold" text-anchor="start">cos 30° = 0.87</text><text x="443.4" y="499.2" font-size="17" fill="#306848" font-weight="bold" text-anchor="start">cos 60° = 0.50</text><text x="502.1" y="540.3" font-size="17" fill="#306848" font-weight="bold" text-anchor="start">cos 90° = 0</text><path d="M 320.0 395.0 L 251.5 297.2" fill="none" stroke="#306848" stroke-width="2.5" stroke-dasharray="7 5"/><rect x="240.5" y="286.2" width="22.0" height="22.0" rx="0" fill="#cdfc80" stroke="#162d26" stroke-width="2"/><text x="271.5" y="281.2" font-size="19" fill="#162d26" font-weight="bold" text-anchor="start">pixel i: Li, ωi, θi</text><text x="320.0" y="655.0" font-size="18" fill="#50665b" font-weight="normal" text-anchor="middle">Centre pixels count fully; the rim counts nothing.</text></g><g id="reading"><rect x="640.0" y="90.0" width="520.0" height="590.0" rx="12" fill="white" stroke="#b8c9ba" stroke-width="2"/><text x="662.0" y="130.0" font-size="19" fill="#306848" font-weight="bold" text-anchor="start">B / READ IT AS</text><rect x="670.0" y="150.0" width="460.0" height="60.0" rx="8" fill="#cdfc80" stroke="#306848" stroke-width="2"/><text x="900.0" y="188.0" font-size="23" fill="#162d26" font-weight="bold" text-anchor="middle">Ev = Σ Li · cos θi · ωi</text><text x="670.0" y="248.0" font-size="19" fill="#50665b" font-weight="normal" text-anchor="start">Check it against the lux sensor at the lens.</text><text x="670.0" y="277.0" font-size="19" fill="#50665b" font-weight="normal" text-anchor="start">A large gap points to clipped sources, a</text><text x="670.0" y="306.0" font-size="19" fill="#50665b" font-weight="normal" text-anchor="start">cropped view or the wrong projection.</text><text x="670.0" y="362.0" font-size="17" fill="#306848" font-weight="bold" text-anchor="start">MELANOPIC ESTIMATE, AN APPROXIMATION</text><text x="670.0" y="394.0" font-size="18" fill="#50665b" font-weight="normal" text-anchor="start">m-EDI ≈ Ev × M-DER of an assumed spectrum</text><text x="670.0" y="421.0" font-size="18" fill="#50665b" font-weight="normal" text-anchor="start">Daylight through glazing: M-DER ≈ 0.9–1.0</text><text x="670.0" y="448.0" font-size="18" fill="#50665b" font-weight="normal" text-anchor="start">Warm-white LED, ~2700 K: roughly 0.4–0.5</text><text x="670.0" y="475.0" font-size="18" fill="#50665b" font-weight="normal" text-anchor="start">RGB does not measure the spectrum: state the</text><text x="670.0" y="502.0" font-size="18" fill="#50665b" font-weight="normal" text-anchor="start">assumed source or use a spectrometer.</text><rect x="670.0" y="548.0" width="272.8" height="26.0" rx="0" fill="#ffffff" stroke="#306848" stroke-width="3"/><text x="952.8" y="568.0" font-size="17" fill="#162d26" font-weight="bold" text-anchor="start">Ev 620 lx</text><rect x="670.0" y="584.0" width="246.4" height="26.0" rx="0" fill="#cdfc80" stroke="#306848" stroke-width="3"/><text x="926.4" y="604.0" font-size="17" fill="#162d26" font-weight="bold" text-anchor="start">m-EDI ≈ 560</text><path d="M 780.0 538.0 L 780.0 624.0" fill="none" stroke="#162d26" stroke-width="2" stroke-dasharray="6 4"/><text x="780.0" y="648.0" font-size="15" fill="#162d26" font-weight="normal" text-anchor="middle">250 lx m-EDI daytime recommendation</text></g><text x="55.0" y="722.0" font-size="21" fill="#162d26" font-weight="normal" text-anchor="start">Ev drives DGP and the non-visual effects of light. It is also the check on the whole capture. Example values.</text></g></svg>
