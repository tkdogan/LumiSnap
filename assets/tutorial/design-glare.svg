<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">Glare: sources in the fisheye view and the DGP scale</title><desc id="desc">A 180-degree fisheye at eye position with a window glare source, the sun, its position and the task zone. A DGP scale from imperceptible to intolerable compares two design moves: a desk facing the window at 0.48 and a desk turned 90 degrees with a blind at 0.33. Example values.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#306848"/></marker></defs>
<g id="background"><rect width="1200" height="740" fill="#f0f3e9"/></g>
<g font-family="Arial, Helvetica, sans-serif"><text x="44.0" y="54.0" font-size="21" fill="#306848" font-weight="bold" text-anchor="start">USE 1 / WILL THIS BE UNCOMFORTABLE? GLARE</text><g id="fisheye"><rect x="40.0" y="90.0" width="560.0" height="580.0" rx="12" fill="white" stroke="#b8c9ba" stroke-width="2"/><text x="62.0" y="130.0" font-size="19" fill="#306848" font-weight="bold" text-anchor="start">A / 180° FISHEYE AT THE EYE, ALONG THE GAZE</text><circle cx="320.0" cy="395.0" r="215.0" fill="#e4ebdf" stroke="#162d26" stroke-width="3" stroke-dasharray=""/><circle cx="320.0" cy="395.0" r="71.7" fill="none" stroke="#b8c9ba" stroke-width="2" stroke-dasharray="6 6"/><circle cx="320.0" cy="395.0" r="143.3" fill="none" stroke="#b8c9ba" stroke-width="2" stroke-dasharray="6 6"/><path d="M 105.0 395.0 L 535.0 395.0" fill="none" stroke="#b8c9ba" stroke-width="2" stroke-dasharray="6 6"/><path d="M 320.0 180.0 L 320.0 610.0" fill="none" stroke="#b8c9ba" stroke-width="2" stroke-dasharray="6 6"/><path d="M 171.0 309.0 Q 219.0 283.0 252.4 327.4 L 233.4 435.4 Q 206.4 475.8 158.4 453.8 Z" fill="#a5c7dd" stroke="#162d26" stroke-width="3" stroke-dasharray=""/><path d="M 171.0 309.0 Q 219.0 283.0 252.4 327.4 L 233.4 435.4 Q 206.4 475.8 158.4 453.8 Z" fill="none" stroke="#cdfc80" stroke-width="7" stroke-dasharray="10 6"/><circle cx="189.8" cy="347.6" r="14.0" fill="#ffffff" stroke="#162d26" stroke-width="3" stroke-dasharray=""/><path d="M 320.0 395.0 L 189.8 347.6" fill="none" stroke="#306848" stroke-width="2.5" stroke-dasharray="7 5"/><text x="260.0" y="335.0" font-size="19" fill="#306848" font-weight="bold" text-anchor="start">P: position</text><text x="76.0" y="162.0" font-size="20" fill="#162d26" font-weight="bold" text-anchor="start">Glare source: Ls, ωs</text><path d="M 150.0 170.0 L 175.0 268.0" fill="none" stroke="#306848" stroke-width="2" stroke-dasharray=""/><rect x="185.0" y="520.0" width="290.0" height="16.0" rx="0" fill="#d9dfce" stroke="#306848" stroke-width="2"/><circle cx="360.0" cy="480.0" r="40.0" fill="none" stroke="#306848" stroke-width="3" stroke-dasharray="8 6"/><text x="410.0" y="487.0" font-size="19" fill="#306848" font-weight="bold" text-anchor="start">Task zone</text><text x="330.0" y="421.0" font-size="18" fill="#50665b" font-weight="normal" text-anchor="start">View direction</text></g><g id="dgp-scale"><rect x="640.0" y="90.0" width="520.0" height="580.0" rx="12" fill="white" stroke="#b8c9ba" stroke-width="2"/><text x="662.0" y="130.0" font-size="19" fill="#306848" font-weight="bold" text-anchor="start">B / DGP FOR TWO DESIGN MOVES (EXAMPLE)</text><rect x="670.0" y="230.0" width="153.3" height="44.0" rx="0" fill="#ffffff" stroke="#306848" stroke-width="2"/><text x="746.7" y="218.0" font-size="16" fill="#162d26" font-weight="normal" text-anchor="middle">imperceptible</text><rect x="823.3" y="230.0" width="76.7" height="44.0" rx="0" fill="#e9f5c9" stroke="#306848" stroke-width="2"/><text x="861.7" y="194.0" font-size="16" fill="#162d26" font-weight="normal" text-anchor="middle">perceptible</text><path d="M 861.7 200.0 L 861.7 228.0" fill="none" stroke="#306848" stroke-width="1.5" stroke-dasharray=""/><rect x="900.0" y="230.0" width="76.7" height="44.0" rx="0" fill="#cdfc80" stroke="#306848" stroke-width="2"/><text x="938.3" y="218.0" font-size="16" fill="#162d26" font-weight="normal" text-anchor="middle">disturbing</text><rect x="976.7" y="230.0" width="153.3" height="44.0" rx="0" fill="#306848" stroke="#306848" stroke-width="2"/><text x="1053.3" y="218.0" font-size="16" fill="#162d26" font-weight="normal" text-anchor="middle">intolerable</text><text x="670.0" y="300.0" font-size="16" fill="#50665b" font-weight="normal" text-anchor="middle">0.25</text><text x="823.3" y="300.0" font-size="16" fill="#50665b" font-weight="normal" text-anchor="middle">0.35</text><text x="900.0" y="300.0" font-size="16" fill="#50665b" font-weight="normal" text-anchor="middle">0.40</text><text x="976.7" y="300.0" font-size="16" fill="#50665b" font-weight="normal" text-anchor="middle">0.45</text><text x="1130.0" y="300.0" font-size="16" fill="#50665b" font-weight="normal" text-anchor="middle">0.55</text><polygon points="1022.7,276.0 1013.7,290.0 1031.7,290.0" fill="#162d26" fill-opacity="1" stroke="#162d26" stroke-width="1"/><path d="M 1022.7 310.0 L 1022.7 323.0" fill="none" stroke="#162d26" stroke-width="1.5" stroke-dasharray="4 4"/><text x="1022.7" y="345.0" font-size="19" fill="#162d26" font-weight="bold" text-anchor="end">A / desk facing the window: 0.48</text><polygon points="792.7,276.0 783.7,290.0 801.7,290.0" fill="#162d26" fill-opacity="1" stroke="#162d26" stroke-width="1"/><path d="M 792.7 310.0 L 792.7 385.0" fill="none" stroke="#162d26" stroke-width="1.5" stroke-dasharray="4 4"/><text x="792.7" y="407.0" font-size="19" fill="#162d26" font-weight="bold" text-anchor="start">B / desk turned 90°, blind: 0.33</text><text x="670.0" y="462.0" font-size="19" fill="#50665b" font-weight="normal" text-anchor="start">Report with DGP: Ev at the lens and each</text><text x="670.0" y="491.0" font-size="19" fill="#50665b" font-weight="normal" text-anchor="start">source’s Ls, ωs and position.</text><text x="670.0" y="520.0" font-size="19" fill="#50665b" font-weight="normal" text-anchor="start">evalglare source threshold: 5 × task-zone</text><text x="670.0" y="549.0" font-size="19" fill="#50665b" font-weight="normal" text-anchor="start">mean (-T), or a fixed 2,000 cd/m² (-b 2000).</text><text x="670.0" y="578.0" font-size="19" fill="#50665b" font-weight="normal" text-anchor="start">UGR is for electric lighting (office limit ~19).</text></g><text x="55.0" y="708.0" font-size="21" fill="#162d26" font-weight="normal" text-anchor="start">A clipped sun underestimates Ls² ωs, and with it DGP: capture the sun with a characterized ND filter.</text></g></svg>
