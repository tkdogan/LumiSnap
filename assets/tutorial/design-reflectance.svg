<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">Reflectance of a matte sample from luminance and illuminance, or against a grey card</title><desc id="desc">A matte sample on a wall reflects the same luminance in every direction. Reflectance equals pi times luminance over illuminance, for example pi times 40 over 250 equals 0.50. Alternatively, compare with an 18 percent grey card in the same light: 0.18 times 49 over 14 equals 0.63. Example values.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#306848"/></marker></defs>
<g id="background"><rect width="1200" height="750" fill="#f0f3e9"/></g>
<g font-family="Arial, Helvetica, sans-serif"><text x="44.0" y="54.0" font-size="21" fill="#306848" font-weight="bold" text-anchor="start">USE 5 / WHAT IS THIS MATERIAL ACTUALLY DOING? REFLECTANCE</text><g id="lux-method"><rect x="40.0" y="90.0" width="560.0" height="580.0" rx="12" fill="white" stroke="#b8c9ba" stroke-width="2"/><text x="62.0" y="130.0" font-size="19" fill="#306848" font-weight="bold" text-anchor="start">A / REFLECTANCE FROM L AND E</text><rect x="520.0" y="140.0" width="30.0" height="400.0" rx="0" fill="#929e88" stroke="#306848" stroke-width="2"/><rect x="496.0" y="260.0" width="24.0" height="120.0" rx="0" fill="#ffffff" stroke="#162d26" stroke-width="3"/><path d="M 493.0 320.0 L 460.5 230.7" fill="none" stroke="#306848" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M 493.0 320.0 L 415.2 265.5" fill="none" stroke="#306848" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M 493.0 320.0 L 398.0 320.0" fill="none" stroke="#306848" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M 493.0 320.0 L 415.2 374.5" fill="none" stroke="#306848" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M 493.0 320.0 L 460.5 409.3" fill="none" stroke="#306848" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M 493 225 A 95 95 0 0 0 493 415" fill="none" stroke="#306848" stroke-width="2" stroke-dasharray="5 5"/><text x="80.0" y="172.0" font-size="18" fill="#306848" font-weight="normal" text-anchor="start">Diffuse surface: the same L</text><text x="80.0" y="196.0" font-size="18" fill="#306848" font-weight="normal" text-anchor="start">in every direction</text><text x="470.0" y="208.0" font-size="19" fill="#162d26" font-weight="bold" text-anchor="end">Matte sample</text><path d="M 474.0 212.0 L 500.0 258.0" fill="none" stroke="#306848" stroke-width="2" stroke-dasharray=""/><rect x="502.0" y="420.0" width="16.0" height="44.0" rx="3" fill="#a5c7dd" stroke="#162d26" stroke-width="2"/><text x="500.0" y="545.0" font-size="18" fill="#162d26" font-weight="bold" text-anchor="end">Lux sensor on the wall, facing out: E</text><path d="M 310.0 390.0 L 498.0 401.5" fill="none" stroke="#306848" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M 310.0 425.0 L 498.0 447.0" fill="none" stroke="#306848" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M 310.0 460.0 L 498.0 492.5" fill="none" stroke="#306848" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="70.0" y="302.0" width="56.0" height="38.0" rx="5" fill="#162d26" stroke="#162d26" stroke-width="2"/><circle cx="126.0" cy="321.0" r="13" fill="#a5c7dd" stroke="#162d26" stroke-width="3"/><path d="M 105.0 340.0 L 105.0 540.0" fill="none" stroke="#162d26" stroke-width="3" stroke-dasharray=""/><path d="M 395.0 320.0 L 150.0 320.0" fill="none" stroke="#306848" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="270.0" y="306.0" font-size="19" fill="#306848" font-weight="bold" text-anchor="middle">L from the HDR</text><rect x="70.0" y="580.0" width="500.0" height="64.0" rx="8" fill="#cdfc80" stroke="#306848" stroke-width="2"/><text x="320.0" y="620.0" font-size="22" fill="#162d26" font-weight="bold" text-anchor="middle">ρ = π L / E   e.g. π × 40 / 250 = 0.50</text></g><g id="grey-card"><rect x="640.0" y="90.0" width="520.0" height="580.0" rx="12" fill="white" stroke="#b8c9ba" stroke-width="2"/><text x="662.0" y="130.0" font-size="19" fill="#306848" font-weight="bold" text-anchor="start">B / AGAINST A GREY CARD IN THE FRAME</text><rect x="670.0" y="150.0" width="460.0" height="270.0" rx="0" fill="#e4ebdf" stroke="#306848" stroke-width="2"/><rect x="720.0" y="200.0" width="140.0" height="140.0" rx="0" fill="#9aa39a" stroke="#162d26" stroke-width="2"/><rect x="940.0" y="200.0" width="140.0" height="140.0" rx="0" fill="#ffffff" stroke="#162d26" stroke-width="3"/><text x="790.0" y="372.0" font-size="18" fill="#162d26" font-weight="normal" text-anchor="middle">Grey card ρ = 0.18</text><text x="790.0" y="400.0" font-size="19" fill="#306848" font-weight="bold" text-anchor="middle">L = 14 cd/m²</text><text x="1010.0" y="372.0" font-size="18" fill="#162d26" font-weight="normal" text-anchor="middle">Sample</text><text x="1010.0" y="400.0" font-size="19" fill="#306848" font-weight="bold" text-anchor="middle">L = 49 cd/m²</text><text x="670.0" y="460.0" font-size="19" fill="#50665b" font-weight="normal" text-anchor="start">Same plane, same light, both matte, view not</text><text x="670.0" y="489.0" font-size="19" fill="#50665b" font-weight="normal" text-anchor="start">grazing. No lux meter needed.</text><text x="670.0" y="518.0" font-size="19" fill="#50665b" font-weight="normal" text-anchor="start">Glossy or textured finishes are not diffuse:</text><text x="670.0" y="547.0" font-size="19" fill="#50665b" font-weight="normal" text-anchor="start">they have no single ρ.</text><rect x="670.0" y="580.0" width="460.0" height="64.0" rx="8" fill="#cdfc80" stroke="#306848" stroke-width="2"/><text x="900.0" y="620.0" font-size="22" fill="#162d26" font-weight="bold" text-anchor="middle">ρx = 0.18 × 49 / 14 = 0.63</text></g><text x="55.0" y="712.0" font-size="21" fill="#162d26" font-weight="normal" text-anchor="start">Use measured reflectances to choose finishes and as inputs to daylight simulation instead of guessed values.</text></g></svg>
