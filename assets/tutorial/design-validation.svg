<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Validation: per-region log ratios between a scale model, a rendering and the real space</title><desc id="desc">The same view of a real space, a 1:20 scale model and a Radiance rendering, with regions ceiling, back wall, floor and window. A dot plot of log10 luminance ratios per region shows the model too bright at the ceiling and window and too dark at the floor, while the rendering stays within plus or minus 0.1. Example values.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#306848"/></marker></defs>
<g id="background"><rect width="1200" height="800" fill="#f0f3e9"/></g>
<g font-family="Arial, Helvetica, sans-serif"><text x="44.0" y="54.0" font-size="21" fill="#306848" font-weight="bold" text-anchor="start">USE 6 / DOES MY MODEL OR SIMULATION TELL THE TRUTH? VALIDATION</text><g id="views"><rect x="40.0" y="90.0" width="360.0" height="290.0" rx="12" fill="white" stroke="#b8c9ba" stroke-width="2"/><text x="62.0" y="130.0" font-size="19" fill="#306848" font-weight="bold" text-anchor="start">REAL SPACE</text><rect x="65.0" y="150.0" width="310.0" height="205.0" rx="0" fill="#ffffff" stroke="#162d26" stroke-width="3"/><polygon points="65.0,150.0 158.0,207.4 282.0,207.4 375.0,150.0" fill="#ffffff" fill-opacity="1" stroke="#162d26" stroke-width="2"/><polygon points="65.0,355.0 158.0,297.6 282.0,297.6 375.0,355.0" fill="#ffffff" fill-opacity="1" stroke="#162d26" stroke-width="2"/><rect x="158.0" y="207.4" width="124.0" height="90.2" rx="0" fill="#ffffff" stroke="#162d26" stroke-width="2"/><polygon points="86.7,211.5 130.1,225.8 130.1,279.1 86.7,293.5" fill="#a5c7dd" fill-opacity="1" stroke="#162d26" stroke-width="2"/><circle cx="220.0" cy="176.7" r="15.0" fill="#cdfc80" stroke="#306848" stroke-width="2" stroke-dasharray=""/><text x="220.0" y="182.7" font-size="16" fill="#162d26" font-weight="bold" text-anchor="middle">C</text><circle cx="220.0" cy="252.5" r="15.0" fill="#cdfc80" stroke="#306848" stroke-width="2" stroke-dasharray=""/><text x="220.0" y="258.5" font-size="16" fill="#162d26" font-weight="bold" text-anchor="middle">W</text><circle cx="220.0" cy="328.4" r="15.0" fill="#cdfc80" stroke="#306848" stroke-width="2" stroke-dasharray=""/><text x="220.0" y="334.4" font-size="16" fill="#162d26" font-weight="bold" text-anchor="middle">F</text><circle cx="108.4" cy="252.5" r="15.0" fill="#cdfc80" stroke="#306848" stroke-width="2" stroke-dasharray=""/><text x="108.4" y="258.5" font-size="16" fill="#162d26" font-weight="bold" text-anchor="middle">G</text><rect x="420.0" y="90.0" width="360.0" height="290.0" rx="12" fill="white" stroke="#b8c9ba" stroke-width="2"/><text x="442.0" y="130.0" font-size="19" fill="#306848" font-weight="bold" text-anchor="start">SCALE MODEL, 1:20</text><rect x="445.0" y="150.0" width="310.0" height="205.0" rx="0" fill="#ffffff" stroke="#162d26" stroke-width="3"/><polygon points="445.0,150.0 538.0,207.4 662.0,207.4 755.0,150.0" fill="#ffffff" fill-opacity="1" stroke="#162d26" stroke-width="2"/><polygon points="445.0,355.0 538.0,297.6 662.0,297.6 755.0,355.0" fill="#929e88" fill-opacity="1" stroke="#162d26" stroke-width="2"/><rect x="538.0" y="207.4" width="124.0" height="90.2" rx="0" fill="#ffffff" stroke="#162d26" stroke-width="2"/><polygon points="466.7,211.5 510.1,225.8 510.1,279.1 466.7,293.5" fill="#a5c7dd" fill-opacity="1" stroke="#162d26" stroke-width="2"/><rect x="800.0" y="90.0" width="360.0" height="290.0" rx="12" fill="white" stroke="#b8c9ba" stroke-width="2"/><text x="822.0" y="130.0" font-size="19" fill="#306848" font-weight="bold" text-anchor="start">RADIANCE RENDERING</text><rect x="825.0" y="150.0" width="310.0" height="205.0" rx="0" fill="#ffffff" stroke="#162d26" stroke-width="3"/><polygon points="825.0,150.0 918.0,207.4 1042.0,207.4 1135.0,150.0" fill="#e9f5c9" fill-opacity="1" stroke="#162d26" stroke-width="2"/><polygon points="825.0,355.0 918.0,297.6 1042.0,297.6 1135.0,355.0" fill="#ffffff" fill-opacity="1" stroke="#162d26" stroke-width="2"/><rect x="918.0" y="207.4" width="124.0" height="90.2" rx="0" fill="#ffffff" stroke="#162d26" stroke-width="2"/><polygon points="846.7,211.5 890.1,225.8 890.1,279.1 846.7,293.5" fill="#a5c7dd" fill-opacity="1" stroke="#162d26" stroke-width="2"/></g><g id="log-ratios"><rect x="40.0" y="405.0" width="1120.0" height="330.0" rx="12" fill="white" stroke="#b8c9ba" stroke-width="2"/><text x="62.0" y="445.0" font-size="19" fill="#306848" font-weight="bold" text-anchor="start">LOG RATIO PER REGION: log₁₀(L / L real)</text><rect x="428.8" y="456.0" width="132.5" height="194.0" rx="0" fill="#cdfc80" stroke="none" stroke-width="0" fill-opacity="0.55"/><path d="M 230.0 456.0 L 230.0 654.0" fill="none" stroke="#b8c9ba" stroke-width="2" stroke-dasharray="5 5"/><text x="230.0" y="678.0" font-size="16" fill="#50665b" font-weight="normal" text-anchor="middle">−0.4</text><path d="M 362.5 456.0 L 362.5 654.0" fill="none" stroke="#b8c9ba" stroke-width="2" stroke-dasharray="5 5"/><text x="362.5" y="678.0" font-size="16" fill="#50665b" font-weight="normal" text-anchor="middle">−0.2</text><path d="M 495.0 456.0 L 495.0 654.0" fill="none" stroke="#162d26" stroke-width="2" stroke-dasharray=""/><text x="495.0" y="678.0" font-size="16" fill="#50665b" font-weight="normal" text-anchor="middle">0.0</text><path d="M 627.5 456.0 L 627.5 654.0" fill="none" stroke="#b8c9ba" stroke-width="2" stroke-dasharray="5 5"/><text x="627.5" y="678.0" font-size="16" fill="#50665b" font-weight="normal" text-anchor="middle">+0.2</text><path d="M 760.0 456.0 L 760.0 654.0" fill="none" stroke="#b8c9ba" stroke-width="2" stroke-dasharray="5 5"/><text x="760.0" y="678.0" font-size="16" fill="#50665b" font-weight="normal" text-anchor="middle">+0.4</text><text x="212.0" y="491.0" font-size="19" fill="#162d26" font-weight="normal" text-anchor="end">ceiling</text><rect x="659.2" y="476.0" width="16.0" height="16.0" rx="0" fill="#162d26" stroke="#162d26" stroke-width="2"/><circle cx="521.5" cy="484.0" r="8.0" fill="#ffffff" stroke="#306848" stroke-width="3" stroke-dasharray=""/><text x="782.0" y="491.0" font-size="18" fill="#306848" font-weight="normal" text-anchor="start">light leak at the model roof?</text><text x="212.0" y="537.0" font-size="19" fill="#162d26" font-weight="normal" text-anchor="end">back wall</text><rect x="453.9" y="522.0" width="16.0" height="16.0" rx="0" fill="#162d26" stroke="#162d26" stroke-width="2"/><circle cx="455.2" cy="530.0" r="8.0" fill="#ffffff" stroke="#306848" stroke-width="3" stroke-dasharray=""/><text x="212.0" y="583.0" font-size="19" fill="#162d26" font-weight="normal" text-anchor="end">floor</text><rect x="361.1" y="568.0" width="16.0" height="16.0" rx="0" fill="#162d26" stroke="#162d26" stroke-width="2"/><circle cx="548.0" cy="576.0" r="8.0" fill="#ffffff" stroke="#306848" stroke-width="3" stroke-dasharray=""/><text x="782.0" y="583.0" font-size="18" fill="#306848" font-weight="normal" text-anchor="start">model material too dark</text><text x="212.0" y="629.0" font-size="19" fill="#162d26" font-weight="normal" text-anchor="end">window</text><rect x="692.4" y="614.0" width="16.0" height="16.0" rx="0" fill="#162d26" stroke="#162d26" stroke-width="2"/><circle cx="415.5" cy="622.0" r="8.0" fill="#ffffff" stroke="#306848" stroke-width="3" stroke-dasharray=""/><text x="782.0" y="629.0" font-size="18" fill="#306848" font-weight="normal" text-anchor="start">model sky ≠ real sky</text><rect x="230.0" y="696.0" width="16.0" height="16.0" rx="0" fill="#162d26" stroke="#162d26" stroke-width="2"/><text x="256.0" y="710.0" font-size="18" fill="#162d26" font-weight="normal" text-anchor="start">model / real</text><circle cx="420.0" cy="704.0" r="8.0" fill="#ffffff" stroke="#306848" stroke-width="3" stroke-dasharray=""/><text x="436.0" y="710.0" font-size="18" fill="#162d26" font-weight="normal" text-anchor="start">rendering / real</text><text x="630.0" y="710.0" font-size="18" fill="#306848" font-weight="bold" text-anchor="start">band: ±0.1 ≈ ±26 %</text></g><text x="55.0" y="772.0" font-size="21" fill="#162d26" font-weight="normal" text-anchor="start">Mismatches in a scale model, such as light leaks, materials and sky, are the lesson, not a failure. Example values.</text></g></svg>
