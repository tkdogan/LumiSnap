<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">Why exposure brackets need overlap</title><desc id="desc">Long exposures record darker surfaces, short exposures record brighter sources, with overlapping usable ranges. Merge the exposures into a linear HDR and then calibrate. A clipped source cannot be recovered by merging.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#306848"/></marker></defs>
<g id="background"><rect width="1200" height="750" fill="#f0f3e9"/></g>
<g font-family="Arial, Helvetica, sans-serif"><text x="44" y="54" font-size="21" fill="#306848" font-weight="bold" text-anchor="start">02 / CHANGE SHUTTER SPEED, KEEP THE SETUP FIXED</text><text x="250" y="115" font-size="24" fill="#162d26" font-weight="bold" text-anchor="start">Darker surfaces</text><text x="1070" y="115" font-size="24" fill="#162d26" font-weight="bold" text-anchor="end">Brighter sources</text><path d="M 250 140 L 1070 140" fill="none" stroke="#306848" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><g id="long-exposure"><text x="55" y="227" font-size="23" fill="#162d26" font-weight="bold" text-anchor="start">Long exposure</text><text x="55" y="258" font-size="21" fill="#50665b" font-weight="normal" text-anchor="start">e.g. 1/30 s</text><rect x="250" y="193" width="460" height="64" rx="7" fill="#cdfc80" stroke="#306848" stroke-width="2"/><text x="480.0" y="232" font-size="23" fill="#162d26" font-weight="normal" text-anchor="middle">Usable signal</text></g><g id="middle-exposure"><text x="55" y="337" font-size="23" fill="#162d26" font-weight="bold" text-anchor="start">Middle exposure</text><text x="55" y="368" font-size="21" fill="#50665b" font-weight="normal" text-anchor="start">e.g. 1/125 s</text><rect x="425" y="303" width="460" height="64" rx="7" fill="#cdfc80" stroke="#306848" stroke-width="2"/><text x="655.0" y="342" font-size="23" fill="#162d26" font-weight="normal" text-anchor="middle">Usable signal</text></g><g id="short-exposure"><text x="55" y="447" font-size="23" fill="#162d26" font-weight="bold" text-anchor="start">Short exposure</text><text x="55" y="478" font-size="21" fill="#50665b" font-weight="normal" text-anchor="start">e.g. 1/500 s</text><rect x="600" y="413" width="460" height="64" rx="7" fill="#cdfc80" stroke="#306848" stroke-width="2"/><text x="830.0" y="452" font-size="23" fill="#162d26" font-weight="normal" text-anchor="middle">Usable signal</text></g><path d="M 595 288 L 595 301 M 770 398 L 770 411" fill="none" stroke="#306848" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="785" y="282" font-size="21" fill="#306848" font-weight="normal" text-anchor="start">Overlap links the exposures.</text><path d="M 250 525 L 1060 525" fill="none" stroke="#306848" stroke-width="7" stroke-dasharray=""/><text x="655" y="570" font-size="25" fill="#162d26" font-weight="bold" text-anchor="middle">MERGE → ONE LINEAR HDR → CALIBRATE TO cd/m²</text><text x="55" y="630" font-size="22" fill="#50665b" font-weight="normal" text-anchor="start">At least one exposure must record each important area above the noise floor and below clipping.</text><text x="55" y="662" font-size="22" fill="#50665b" font-weight="normal" text-anchor="start">If a source clips in every frame, the merge cannot recover it. Extend the bracket or revise the capture setup.</text><text x="55" y="714" font-size="20" fill="#50665b" font-weight="normal" text-anchor="start">Conceptual ranges only. These shutter speeds illustrate two-stop spacing; they are not a universal capture recipe.</text></g></svg>
