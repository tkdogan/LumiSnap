<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">Luminance and illuminance measurements</title><desc id="desc">A spot luminance meter measures a target in cd/m² and scales the image. A vertical illuminance sensor at the lens measures Ev in lux for validation. A horizontal upward-facing sensor measures workplane illuminance in lux for daylight studies.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#306848"/></marker></defs>
<g id="background"><rect width="1200" height="750" fill="#f0f3e9"/></g>
<g font-family="Arial, Helvetica, sans-serif"><text x="44" y="54" font-size="21" fill="#306848" font-weight="bold" text-anchor="start">03 / THREE MEASUREMENTS, THREE DIFFERENT QUESTIONS</text><rect x="40" y="90" width="340" height="530" rx="12" fill="#ffffff" stroke="#b8c9ba" stroke-width="2"/><text x="60" y="132" font-size="19" fill="#306848" font-weight="bold" text-anchor="start">A / SPOT LUMINANCE</text><text x="60" y="166" font-size="21" fill="#162d26" font-weight="normal" text-anchor="start">cd/m²</text><text x="60" y="195" font-size="21" fill="#162d26" font-weight="normal" text-anchor="start">How bright is this surface?</text><rect x="430" y="90" width="340" height="530" rx="12" fill="#ffffff" stroke="#b8c9ba" stroke-width="2"/><text x="450" y="132" font-size="19" fill="#306848" font-weight="bold" text-anchor="start">B / EYE ILLUMINANCE</text><text x="450" y="166" font-size="21" fill="#162d26" font-weight="normal" text-anchor="start">lx</text><text x="450" y="195" font-size="21" fill="#162d26" font-weight="normal" text-anchor="start">How much light arrives</text><text x="450" y="224" font-size="21" fill="#162d26" font-weight="normal" text-anchor="start">at the eye?</text><rect x="820" y="90" width="340" height="530" rx="12" fill="#ffffff" stroke="#b8c9ba" stroke-width="2"/><text x="840" y="132" font-size="19" fill="#306848" font-weight="bold" text-anchor="start">C / WORKPLANE ILLUMINANCE</text><text x="840" y="166" font-size="21" fill="#162d26" font-weight="normal" text-anchor="start">lx</text><text x="840" y="195" font-size="21" fill="#162d26" font-weight="normal" text-anchor="start">How much light reaches</text><text x="840" y="224" font-size="21" fill="#162d26" font-weight="normal" text-anchor="start">the desk?</text><g id="spot-meter"><rect x="280" y="260" width="58" height="130" rx="0" fill="#929e88" stroke="#306848" stroke-width="2"/><path d="M 105 330 L 280 305 L 280 355 Z" fill="#cdfc80" stroke="#306848" stroke-width="2"/><rect x="65" y="313" width="62" height="35" rx="4" fill="#162d26" stroke="#162d26" stroke-width="2"/><text x="210" y="278" font-size="20" fill="#162d26" font-weight="normal" text-anchor="middle">Matte target</text><text x="60" y="442" font-size="20" fill="#50665b" font-weight="normal" text-anchor="start">Aim from near the lens position.</text><text x="60" y="474" font-size="20" fill="#50665b" font-weight="normal" text-anchor="start">Keep the meter&#x27;s entire spot</text><text x="60" y="506" font-size="20" fill="#50665b" font-weight="normal" text-anchor="start">inside one uniform surface.</text><text x="60" y="538" font-size="20" fill="#50665b" font-weight="normal" text-anchor="start">Repeat on several targets.</text><text x="60" y="594" font-size="20" fill="#306848" font-weight="normal" text-anchor="start">Sets the image luminance scale.</text></g><g id="eye-lux-meter"><path d="M 625 250 L 520 320 M 665 330 L 530 330 M 625 410 L 520 340" fill="none" stroke="#306848" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="485" y="285" width="18" height="90" rx="4" fill="#a5c7dd" stroke="#306848" stroke-width="2"/><path d="M 494 375 L 494 408" fill="none" stroke="#162d26" stroke-width="3" stroke-dasharray=""/><text x="550" y="244" font-size="20" fill="#162d26" font-weight="normal" text-anchor="middle">Incoming light</text><text x="450" y="442" font-size="20" fill="#50665b" font-weight="normal" text-anchor="start">Sensor vertical at the lens.</text><text x="450" y="474" font-size="20" fill="#50665b" font-weight="normal" text-anchor="start">Face the same way as the</text><text x="450" y="506" font-size="20" fill="#50665b" font-weight="normal" text-anchor="start">camera; avoid shading it.</text><text x="450" y="538" font-size="20" fill="#50665b" font-weight="normal" text-anchor="start">Read before and after.</text><text x="450" y="594" font-size="20" fill="#306848" font-weight="normal" text-anchor="start">Checks the hemispheric total (Ev).</text></g><g id="desk-lux-meter"><rect x="860" y="368" width="250" height="14" rx="0" fill="#d9dfce" stroke="#306848" stroke-width="2"/><path d="M 875 382 L 875 405 M 1095 382 L 1095 405" fill="none" stroke="#162d26" stroke-width="3" stroke-dasharray=""/><rect x="960" y="350" width="65" height="16" rx="4" fill="#a5c7dd" stroke="#306848" stroke-width="2"/><path d="M 990 255 L 990 335 M 905 280 L 968 337 M 1075 280 L 1015 337" fill="none" stroke="#306848" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="840" y="442" font-size="20" fill="#50665b" font-weight="normal" text-anchor="start">Sensor horizontal, facing up.</text><text x="840" y="474" font-size="20" fill="#50665b" font-weight="normal" text-anchor="start">Measure a grid on the actual</text><text x="840" y="506" font-size="20" fill="#50665b" font-weight="normal" text-anchor="start">desk or model workplane.</text><text x="840" y="538" font-size="20" fill="#50665b" font-weight="normal" text-anchor="start">Record height and locations.</text><text x="840" y="594" font-size="20" fill="#306848" font-weight="normal" text-anchor="start">Tests daylight reaching the task.</text></g><text x="55" y="674" font-size="22" fill="#162d26" font-weight="normal" text-anchor="start">A lux reading cannot be entered into a cd/m² calibration field. Surface reflectance and light direction matter.</text><text x="55" y="711" font-size="21" fill="#50665b" font-weight="normal" text-anchor="start">Match each measurement to its image, location, orientation and time. Record the instrument and its calibration status.</text></g></svg>
