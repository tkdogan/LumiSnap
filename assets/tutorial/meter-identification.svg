<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1110" viewBox="0 0 1200 1110" role="img" aria-labelledby="title desc">
<title id="title">Which light meter measures what?</title><desc id="desc">Side-by-side original diagrams of the Konica Minolta T-10A illuminance meter, with a white diffuser and lux display, and the LS-150 spot luminance meter, with a lens, viewfinder and cd/m² display. Place the illuminance sensor on the measurement plane; aim the luminance meter at a selected patch for HDR calibration. Example readings are not paired measurements.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#306848"/></marker></defs>
<g id="background"><rect width="1200" height="1110" fill="#f0f3e9"/></g>
<g font-family="Arial, Helvetica, sans-serif"><text x="44" y="54" font-size="21" fill="#306848" font-weight="bold" text-anchor="start">KNOW YOUR METERS / KONICA MINOLTA EXAMPLES</text><rect x="40" y="92" width="540" height="840" rx="12" fill="white" stroke="#b8c9ba" stroke-width="2"/><rect x="620" y="92" width="540" height="840" rx="12" fill="white" stroke="#b8c9ba" stroke-width="2"/><g id="illuminance-meter-labels"><text x="68" y="141" font-size="30" fill="#162d26" font-weight="bold" text-anchor="start">ILLUMINANCE METER</text><text x="68" y="178" font-size="23" fill="#50665b" font-weight="normal" text-anchor="start">Konica Minolta T-10A</text><text x="68" y="233" font-size="42" fill="#306848" font-weight="bold" text-anchor="start">lux (lx)</text></g><g id="t10a-body"><rect x="223" y="334" width="130" height="244" rx="16" fill="#303938" stroke="#162d26" stroke-width="2"/><circle cx="288" cy="320" r="55" fill="#303938" stroke="#162d26" stroke-width="3"/><circle cx="288" cy="320" r="42" fill="#1b2422" stroke="#56625d" stroke-width="2"/><circle cx="288" cy="320" r="29" fill="#f7f9f3" stroke="#bdc8bf" stroke-width="2"/><path d="M 229 383 L 347 383" fill="none" stroke="#65736a" stroke-width="2" stroke-dasharray=""/><rect x="235" y="402" width="106" height="61" rx="3" fill="#cbd8ba" stroke="#111d17" stroke-width="2"/><text x="246" y="441" font-size="30" fill="#162d26" font-weight="normal" text-anchor="start">500</text><text x="317" y="450" font-size="16" fill="#162d26" font-weight="normal" text-anchor="start">lx</text><rect x="236" y="477" width="30" height="11" rx="3" fill="#a8d0c6" stroke="#172a23" stroke-width="2"/><rect x="272" y="477" width="30" height="11" rx="3" fill="#a8d0c6" stroke="#172a23" stroke-width="2"/><rect x="308" y="477" width="30" height="11" rx="3" fill="#a8d0c6" stroke="#172a23" stroke-width="2"/><rect x="235" y="508" width="106" height="35" rx="3" fill="#26302b" stroke="#48594d" stroke-width="2"/><text x="288" y="564" font-size="15" fill="#d8e4d8" font-weight="normal" text-anchor="middle">T-10A</text></g><g id="t10a-callouts"><text x="68" y="283" font-size="20" fill="#162d26" font-weight="normal" text-anchor="start">White diffuser</text><text x="68" y="310" font-size="20" fill="#162d26" font-weight="normal" text-anchor="start">collects light</text><path d="M 197 299 L 236 299 L 260 313" fill="none" stroke="#306848" stroke-width="2" stroke-dasharray=""/><text x="68" y="433" font-size="20" fill="#162d26" font-weight="normal" text-anchor="start">Read lux (lx)</text><path d="M 185 430 L 232 430" fill="none" stroke="#306848" stroke-width="2" stroke-dasharray=""/><text x="375" y="394" font-size="20" fill="#162d26" font-weight="normal" text-anchor="start">No viewfinder</text><path d="M 374 406 L 351 419" fill="none" stroke="#306848" stroke-width="2" stroke-dasharray=""/></g><g id="luminance-meter-labels"><text x="648" y="141" font-size="30" fill="#162d26" font-weight="bold" text-anchor="start">LUMINANCE METER</text><text x="648" y="178" font-size="23" fill="#50665b" font-weight="normal" text-anchor="start">Konica Minolta LS-150</text><text x="648" y="233" font-size="42" fill="#306848" font-weight="bold" text-anchor="start">cd/m²</text></g><g id="ls150-body"><path d="M 803 323 H 951 Q 982 323 982 351 V 419 Q 982 445 956 448 L 919 451 L 902 562 H 850 L 862 452 H 810 Q 786 452 786 428 V 348 Q 786 323 803 323 Z" fill="#303938" stroke="#162d26" stroke-width="3"/><rect x="762" y="361" width="25" height="43" rx="5" fill="#1a2320" stroke="#162d26" stroke-width="2"/><rect x="981" y="338" width="62" height="96" rx="4" fill="#202b25" stroke="#162d26" stroke-width="2"/><rect x="1015" y="338" width="28" height="96" rx="3" fill="#455149" stroke="#162d26" stroke-width="2"/><path d="M 1020 343 L 1020 429" fill="none" stroke="#a6b4a9" stroke-width="1" stroke-dasharray=""/><path d="M 1025 343 L 1025 429" fill="none" stroke="#a6b4a9" stroke-width="1" stroke-dasharray=""/><path d="M 1030 343 L 1030 429" fill="none" stroke="#a6b4a9" stroke-width="1" stroke-dasharray=""/><path d="M 1035 343 L 1035 429" fill="none" stroke="#a6b4a9" stroke-width="1" stroke-dasharray=""/><path d="M 1040 343 L 1040 429" fill="none" stroke="#a6b4a9" stroke-width="1" stroke-dasharray=""/><ellipse cx="1045" cy="386" rx="11" ry="47" fill="#1b2822" stroke="#162d26" stroke-width="3"/><ellipse cx="1047" cy="386" rx="5" ry="32" fill="#8fb6bc"/><text x="810" y="369" font-size="23" fill="#e2eae2" font-weight="bold" text-anchor="start">LS-150</text><path d="M 810 380 L 954 380" fill="none" stroke="#bdc8bf" stroke-width="1" stroke-dasharray=""/><path d="M 923 452 L 916 488 Q 929 485 933 462 Z" fill="#92b0a0" stroke="#162d26" stroke-width="2"/><path d="M 863 534 L 896 534" fill="none" stroke="#64766a" stroke-width="2" stroke-dasharray=""/></g><g id="ls150-callouts"><text x="648" y="283" font-size="20" fill="#162d26" font-weight="normal" text-anchor="start">Viewfinder:</text><text x="648" y="310" font-size="20" fill="#162d26" font-weight="normal" text-anchor="start">look through here</text><path d="M 742 321 L 742 350 L 764 375" fill="none" stroke="#306848" stroke-width="2" stroke-dasharray=""/><text x="977" y="283" font-size="20" fill="#162d26" font-weight="normal" text-anchor="start">Lens:</text><text x="977" y="310" font-size="20" fill="#162d26" font-weight="normal" text-anchor="start">aim at a patch</text><path d="M 1057 319 L 1068 346 L 1055 368" fill="none" stroke="#306848" stroke-width="2" stroke-dasharray=""/><rect x="965" y="492" width="160" height="78" rx="5" fill="#e4ebdf" stroke="#b8c9ba" stroke-width="2"/><text x="1045" y="483" font-size="16" fill="#50665b" font-weight="normal" text-anchor="middle">Rear LCD (example)</text><text x="983" y="532" font-size="29" fill="#162d26" font-weight="normal" text-anchor="start">150</text><text x="1040" y="555" font-size="19" fill="#162d26" font-weight="normal" text-anchor="start">cd/m²</text><path d="M 960 441 L 985 492" fill="none" stroke="#306848" stroke-width="2" stroke-dasharray=""/></g><g id="measurement-questions"><text x="68" y="628" font-size="25" fill="#306848" font-weight="bold" text-anchor="start">LIGHT ARRIVING AT A PLANE</text><text x="68" y="665" font-size="22" fill="#162d26" font-weight="normal" text-anchor="start">How much light reaches this position?</text><text x="648" y="628" font-size="25" fill="#306848" font-weight="bold" text-anchor="start">LIGHT FROM A SELECTED PATCH</text><text x="648" y="665" font-size="22" fill="#162d26" font-weight="normal" text-anchor="start">How bright is that surface from here?</text><text x="68" y="724" font-size="21" fill="#162d26" font-weight="normal" text-anchor="start">PLACE the sensor on the measurement plane.</text><text x="68" y="760" font-size="21" fill="#162d26" font-weight="normal" text-anchor="start">Desk: white sensor faces up.</text><text x="68" y="796" font-size="21" fill="#162d26" font-weight="normal" text-anchor="start">Eye plane: sensor faces the view direction.</text><text x="68" y="832" font-size="21" fill="#162d26" font-weight="normal" text-anchor="start">Use: workplane lux or eye illuminance (Ev).</text><text x="648" y="724" font-size="21" fill="#162d26" font-weight="normal" text-anchor="start">AIM the lens; look through the viewfinder.</text><text x="648" y="760" font-size="21" fill="#162d26" font-weight="normal" text-anchor="start">Keep the central measuring circle on one patch.</text><text x="648" y="796" font-size="21" fill="#162d26" font-weight="normal" text-anchor="start">LS-150 spot: 1° (not the full viewfinder view).</text><text x="648" y="832" font-size="21" fill="#162d26" font-weight="normal" text-anchor="start">Use: spot readings for HDR calibration.</text><text x="68" y="894" font-size="22" fill="#306848" font-weight="bold" text-anchor="start">WHITE DIFFUSER → PLACE IT</text><text x="648" y="894" font-size="22" fill="#306848" font-weight="bold" text-anchor="start">LENS + VIEWFINDER → AIM IT</text></g><rect x="40" y="958" width="1120" height="73" rx="8" fill="#cdfc80" stroke="#306848" stroke-width="2"/><text x="600" y="1003" font-size="23" fill="#162d26" font-weight="bold" text-anchor="middle">Enter cd/m² spot readings into HDR calibration. A lux reading belongs to a different measurement.</text><text x="44" y="1074" font-size="20" fill="#50665b" font-weight="normal" text-anchor="start">Simplified instrument drawings in standard configurations. Display numbers are illustrative, not paired measurements.</text></g></svg>
