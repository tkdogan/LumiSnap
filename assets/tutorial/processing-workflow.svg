<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="845" viewBox="0 0 1200 845" role="img" aria-labelledby="title desc">
<title id="title">Processing and validation workflow</title><desc id="desc">Merge, correct lens geometry and vignetting, calibrate to spot luminance readings, then independently validate. Branch to daylight studies or glare analysis, which requires a fisheye and a calibrated hemispheric view.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#306848"/></marker></defs>
<g id="background"><rect width="1200" height="845" fill="#f0f3e9"/></g>
<g font-family="Arial, Helvetica, sans-serif"><text x="44" y="54" font-size="21" fill="#306848" font-weight="bold" text-anchor="start">04 / FROM EXPOSURES TO EVIDENCE</text><rect x="50" y="110" width="320" height="195" rx="12" fill="white" stroke="#b8c9ba" stroke-width="2"/><text x="70" y="150" font-size="23" fill="#306848" font-weight="bold" text-anchor="start">1 / MERGE</text><text x="70" y="198" font-size="21" fill="#50665b" font-weight="normal" text-anchor="start">Read exposure metadata.</text><text x="70" y="230" font-size="21" fill="#50665b" font-weight="normal" text-anchor="start">Align frames; undo the</text><text x="70" y="262" font-size="21" fill="#50665b" font-weight="normal" text-anchor="start">JPEG response curve.</text><rect x="440" y="110" width="320" height="195" rx="12" fill="white" stroke="#b8c9ba" stroke-width="2"/><text x="460" y="150" font-size="23" fill="#306848" font-weight="bold" text-anchor="start">2 / LENS</text><text x="460" y="198" font-size="21" fill="#50665b" font-weight="normal" text-anchor="start">Set projection and field of view.</text><text x="460" y="230" font-size="21" fill="#50665b" font-weight="normal" text-anchor="start">Check the image circle.</text><text x="460" y="262" font-size="21" fill="#50665b" font-weight="normal" text-anchor="start">Apply measured vignetting.</text><rect x="830" y="110" width="320" height="195" rx="12" fill="white" stroke="#b8c9ba" stroke-width="2"/><text x="850" y="150" font-size="23" fill="#306848" font-weight="bold" text-anchor="start">3 / CALIBRATE</text><text x="850" y="198" font-size="21" fill="#50665b" font-weight="normal" text-anchor="start">Select the measured targets.</text><text x="850" y="230" font-size="21" fill="#50665b" font-weight="normal" text-anchor="start">Enter spot readings in cd/m².</text><text x="850" y="262" font-size="21" fill="#50665b" font-weight="normal" text-anchor="start">Inspect fit and disagreements.</text><path d="M 375 207 L 425 207" fill="none" stroke="#306848" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M 765 207 L 815 207" fill="none" stroke="#306848" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M 990 315 L 990 360 L 600 360 L 600 390" fill="none" stroke="#306848" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="325" y="400" width="550" height="132" rx="12" fill="#cdfc80" stroke="#306848" stroke-width="2"/><text x="600" y="442" font-size="22" fill="#162d26" font-weight="bold" text-anchor="middle">4 / CHECK INDEPENDENT MEASUREMENTS</text><text x="600" y="477" font-size="21" fill="#162d26" font-weight="normal" text-anchor="middle">Hold out a spot; compare image Ev with measured Ev.</text><text x="600" y="508" font-size="21" fill="#162d26" font-weight="normal" text-anchor="middle">Check clipping, movement, flare and scene changes.</text><path d="M 465 540 L 465 574 L 280 574 L 280 602" fill="none" stroke="#306848" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M 735 540 L 735 574 L 920 574 L 920 602" fill="none" stroke="#306848" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="50" y="615" width="480" height="136" rx="12" fill="white" stroke="#b8c9ba" stroke-width="2"/><text x="75" y="652" font-size="23" fill="#306848" font-weight="bold" text-anchor="start">DAYLIGHT / LUMINANCE STUDY</text><text x="75" y="690" font-size="21" fill="#50665b" font-weight="normal" text-anchor="start">Compare surfaces and design alternatives.</text><text x="75" y="722" font-size="21" fill="#50665b" font-weight="normal" text-anchor="start">Match the view, sky and false-colour scale.</text><rect x="670" y="615" width="480" height="136" rx="12" fill="white" stroke="#b8c9ba" stroke-width="2"/><text x="695" y="652" font-size="23" fill="#306848" font-weight="bold" text-anchor="start">GLARE / FISHEYE REQUIRED</text><text x="695" y="690" font-size="21" fill="#50665b" font-weight="normal" text-anchor="start">Use a calibrated 180° view at eye position.</text><text x="695" y="722" font-size="21" fill="#50665b" font-weight="normal" text-anchor="start">Inspect sources; analyse DGP with evalglare.</text><text x="55" y="805" font-size="22" fill="#162d26" font-weight="normal" text-anchor="start">Archive original exposures, calibration data, lens profile, HDR, view information and analysis settings together.</text></g></svg>
